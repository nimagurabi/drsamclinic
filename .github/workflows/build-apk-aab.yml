name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          echo "Generating automated release keystore..."
          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias drsamclinic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass drsamclinic123 \
            -keypass drsamclinic123 \
            -dname "CN=DrSamClinic, OU=App, O=DrSamClinic, L=Tehran, C=IR"
        env:
          KEYSTORE_FILE: "release.jks"
          KEYSTORE_PASSWORD: "drsamclinic123"
          KEY_ALIAS: "drsamclinic"
          KEY_PASSWORD: "drsamclinic123"

      - name: Build Debug APK, Release APK and Google Play AAB
        env:
          KEYSTORE_FILE: "release.jks"
          KEYSTORE_PASSWORD: "drsamclinic123"
          KEY_ALIAS: "drsamclinic"
          KEY_PASSWORD: "drsamclinic123"
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK (برای تست سریع روی گوشی)
        uses: actions/upload-artifact@v4
        with:
          name: drsamclinic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK (فایل نصبی نهایی)
        uses: actions/upload-artifact@v4
        with:
          name: drsamclinic-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Google Play AAB (فایل مخصوص گوگل پلی)
        uses: actions/upload-artifact@v4
        with:
          name: drsamclinic-google-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
